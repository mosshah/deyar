services:
  # --------------------------------------------------
  # Backend Web Service (Django + DRF)
  # --------------------------------------------------
  - type: web
    name: deyar-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: deyar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: deyar-frontend
          property: url
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: deyar-frontend
          property: url

  # --------------------------------------------------
  # Frontend Web Service (Next.js 16)
  # --------------------------------------------------
  - type: web
    name: deyar-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: deyar-backend
          property: url
          appendPath: /api/v1

databases:
  # --------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------
  - name: deyar-db
    databaseName: deyar_db
    user: deyar_user
    plan: free
