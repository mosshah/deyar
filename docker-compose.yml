version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: deyar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deyar_db
      POSTGRES_USER: deyar_user
      POSTGRES_PASSWORD: deyar_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deyar_user -d deyar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
