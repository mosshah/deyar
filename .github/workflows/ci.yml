name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deyar_db
          POSTGRES_USER: deyar_user
          POSTGRES_PASSWORD: deyar_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Code formatting & Lint
      run: |
        black --check backend/
        flake8 backend/ --max-line-length=120 --exclude=migrations,venv --extend-ignore=F403,F401

    - name: Run Backend Tests
      env:
        DATABASE_URL: postgres://deyar_user:deyar_password@localhost:5432/deyar_db
        SECRET_KEY: ci-secret-key-test
      run: |
        pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint & Type Check
      run: |
        cd frontend
        npm run lint

    - name: Build Next.js
      run: |
        cd frontend
        npm run build
